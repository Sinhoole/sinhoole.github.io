{{- /* Twikoo Comments */ -}}
{{- if (.Param "comments") }}
<div class="twikoo-comment">
  <div class="pagination__title">
    <span class="pagination__title-h" style="font-size:1rem;font-weight:500;">评论</span>
    <hr />
  </div>
  <div id="tcomment"></div>
  <script src="https://cdn.jsdelivr.net/npm/twikoo@{{ .Site.Params.twikoo.version }}/dist/twikoo.all.min.js"></script>
  <script>
    twikoo.init({
      envId: "{{ .Site.Params.twikoo.envId }}",
      el: "#tcomment",
      lang: "zh-CN",
      path: window.location.pathname,
    });
  </script>
</div>
{{- end }}
